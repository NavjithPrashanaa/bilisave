services:
  # Backend FastAPI Web Service
  - type: web
    name: bijlisave-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python seed_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: BijliSave
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://bijlisave-web.onrender.com"

  # Frontend React+Vite Static Site
  - type: web
    name: bijlisave-web
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bijlisave-api
          type: web
          property: host
